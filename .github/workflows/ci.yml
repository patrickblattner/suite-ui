name: ci

# The package gate on the own runners (SUI-FEATURE-076): lint, types, tests, package build, parity
# command and the gallery screenshots, on every push to `main` and every tag. `npm run release:tag`
# tags only a commit with a green run of this workflow.
#
# The gallery screenshots are compared inside the pinned Playwright image (`GL-TEST-019`), the same
# image `npm run gallery:image` uses for the local gate, so both read one set of baselines.
# Until a runner is registered for this repo the runs wait in the queue.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # `container.image` has to be fixed before a job's first step, so the pin is read here and passed
  # on as a job output; it is written out only in `scripts/playwright-image.ts`.
  resolve-image:
    runs-on: [self-hosted, proxmox]
    timeout-minutes: 5
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: pin
        run: echo "image=$(node scripts/playwright-image.ts)" >> "$GITHUB_OUTPUT"

  gate:
    needs: resolve-image
    runs-on: [self-hosted, proxmox]
    timeout-minutes: 45
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      options: --ipc=host
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: parity command
        run: node dist/parity/cli.js --app community --root test/fixtures/community-migrated
      - name: gallery screenshots
        run: npm run gallery
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
